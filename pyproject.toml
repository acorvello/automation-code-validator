[project]
name = "automation-code-validator"
version = "0.1.0"
description = "Automation Code Validator for analyzing Cypress logs with LangGraph and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "langgraph>=0.0.1",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C", "D"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "utils"]
