name: Quality checks

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s src/tests -v

      - name: Run Ruff
        run: >-
          ruff check --select E,F --extend-ignore E402
          src/utils/config.py src/utils/llm_client.py src/main.py
          src/tests/test_config.py src/tests/test_llm_client.py
          src/tests/test_web_ui.py web_ui/app.py
